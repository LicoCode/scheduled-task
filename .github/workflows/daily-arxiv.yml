name: arXiv Daily Papers

on:
  schedule:
    # 每天北京时间 10:00（UTC 02:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arXiv digest
        env:
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES || secrets.ARXIV_CATEGORIES || 'cs.AI,cs.LG,cs.CL,cs.CV,cs.RO,cs.NE,stat.ML' }}
          ARXIV_MAX_PAPERS: ${{ vars.ARXIV_MAX_PAPERS || secrets.ARXIV_MAX_PAPERS || '10' }}
          ARXIV_CANDIDATE_POOL: ${{ vars.ARXIV_CANDIDATE_POOL || secrets.ARXIV_CANDIDATE_POOL || '25' }}
          ARXIV_TOPIC_KEYWORDS: ${{ vars.ARXIV_TOPIC_KEYWORDS || secrets.ARXIV_TOPIC_KEYWORDS }}
        run: python -m src.main arxiv

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-digest-report
          path: reports/
          if-no-files-found: ignore
